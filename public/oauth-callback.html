<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="refresh"
      content="0;url=exp://172.20.10.3:8081"
      id="refresh-meta"
    />
    <title>Signing in...</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #5c8a6f 0%, #a8d24e 100%);
        color: white;
      }
      .container {
        text-align: center;
        padding: 40px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        backdrop-filter: blur(10px);
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Signing you in...</h1>
      <p>This window will close automatically</p>
    </div>

    <script>
      // Extract the authorization code from the URL
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      const error = urlParams.get("error");

      if (error) {
        // Remove the meta refresh
        document.getElementById("refresh-meta")?.remove();
        document.querySelector(".container").innerHTML = `
                <h1>❌ Authentication Failed</h1>
                <p>${error}</p>
                <p style="margin-top: 20px; font-size: 14px;">You can close this window</p>
            `;
      } else if (code) {
        // Build redirect URL with code
        const redirectUrl = `exp://172.20.10.3:8081?code=${encodeURIComponent(code)}`;

        // Update meta refresh with the code
        const metaTag = document.getElementById("refresh-meta");
        if (metaTag) {
          metaTag.setAttribute("content", `0;url=${redirectUrl}`);
        }

        // Also use JavaScript redirect as fallback
        window.location.replace(redirectUrl);

        // Show UI with manual fallback
        document.querySelector(".container").innerHTML = `
          <h1>✓ Success!</h1>
          <p>Returning to app...</p>
          <p style="margin-top: 20px;"><a href="${redirectUrl}" style="color: white; text-decoration: underline;">Click here if not redirected</a></p>
        `;
      } else {
        // Remove the meta refresh
        document.getElementById("refresh-meta")?.remove();
        document.querySelector(".container").innerHTML = `
                <h1>⚠ No authentication code</h1>
                <p>You can close this window</p>
            `;
      }
    </script>
  </body>
</html>
